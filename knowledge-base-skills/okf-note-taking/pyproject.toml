[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "okf-note-taking"
version = "0.2.0"
description = "A skill and CLI helper for maintaining learning notes in the Open Knowledge Format (OKF) v0.2."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Kimi Code CLI User" },
]
keywords = ["okf", "knowledge-format", "notes", "markdown", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
okf-notes = "scripts.okf_notes:main"

[project.urls]
Homepage = "https://github.com/GoogleCloudPlatform/open-knowledge-format"
Documentation = "https://github.com/GoogleCloudPlatform/open-knowledge-format/blob/main/SPEC.md"

[tool.setuptools]
packages = ["scripts"]
